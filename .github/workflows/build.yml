name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |What went wrong|Could not resolve|error:" -A3 build.log | head -45 | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Real build error::${msg}"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalVault-V1.5-APK
          path: app/build/outputs/apk/debug/*.apk
